# Render Blueprint for InsightPDF AI backend.
# Import via render.com → New → Blueprint → pick this repo.
#
# After import, set these in the Render dashboard (Service → Environment):
#   GOOGLE_API_KEY            = your Gemini key
#   FRONTEND_ORIGINS          = comma-separated frontend URLs (e.g. https://insightpdf-ai.vercel.app)
#   SUPABASE_URL              = https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  = the project's publishable (public) key
#
# Data lives in Supabase (accounts, private PDF storage, Postgres + pgvector),
# so nothing is lost when this free service sleeps, restarts or redeploys.
# No service-role key is needed: every request runs as the signed-in user,
# and row-level security keeps each user's data private.
#
# Free plan note: the service sleeps after 15 min idle; the first request then
# takes ~1 minute while it wakes up.

services:
  - type: web
    name: insightpdf-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: TOP_K
        value: "4"
      - key: PYTHON_VERSION
        value: 3.12.7
