# Render Blueprint for InsightPDF AI backend.
# Import via render.com → New → Blueprint → pick this repo.
#
# After import, set these in the Render dashboard (Service → Environment):
#   GOOGLE_API_KEY    = your Gemini key
#   FRONTEND_ORIGINS  = comma-separated list of frontend URLs (e.g. https://insightpdf-ai.vercel.app)
#
# Free plan notes:
#   - The free Web Service sleeps after 15 min idle; the first request then
#     takes ~1 minute while it wakes up.
#   - Free services can't have a persistent disk, so uploaded PDFs and their
#     vectors are wiped whenever the service restarts or redeploys. Users just
#     re-upload. To keep data, upgrade to Starter and add:
#         disk:
#           name: data
#           mountPath: /var/data
#           sizeGB: 1
#     then set UPLOAD_DIR=/var/data/uploads and CHROMA_DIR=/var/data/chroma_db.

services:
  - type: web
    name: insightpdf-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: CHROMA_DIR
        value: chroma_db
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: TOP_K
        value: "4"
      - key: PYTHON_VERSION
        value: 3.12.7
